<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">KwaCart live session  host and guest</title>
  <desc id="desc">A host screen running 1-2-4-All with a timer and participant list, beside a phone where a guest types a response.</desc>
  <rect width="880" height="420" fill="#F4F7F7"/>
  <!-- Host window -->
  <rect x="40" y="48" width="520" height="324" rx="12" fill="#fff" stroke="#D4E4E4" stroke-width="2"/>
  <rect x="40" y="48" width="520" height="36" rx="12" fill="#E6F2F2"/>
  <rect x="40" y="72" width="520" height="12" fill="#E6F2F2"/>
  <circle cx="64" cy="66" r="5" fill="#D4E4E4"/>
  <circle cx="82" cy="66" r="5" fill="#D4E4E4"/>
  <circle cx="100" cy="66" r="5" fill="#D4E4E4"/>
  <text x="120" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#5A6B6B">Host  live session</text>
  <text x="64" y="118" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#1A2B2B">1-2-4-All</text>
  <text x="64" y="142" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0E7C7B">Phase 2 · Pairs · 2:00</text>
  <rect x="64" y="156" width="472" height="8" rx="4" fill="#E6F2F2"/>
  <rect x="64" y="156" width="260" height="8" rx="4" fill="#0E7C7B"/>
  <rect x="64" y="184" width="472" height="36" rx="6" fill="#F4F7F7" stroke="#D4E4E4"/>
  <text x="76" y="206" font-family="system-ui,sans-serif" font-size="12" fill="#3D4F4F">Amira  composing</text>
  <circle cx="500" cy="202" r="5" fill="#F0C419"/>
  <rect x="64" y="228" width="472" height="36" rx="6" fill="#F4F7F7" stroke="#D4E4E4"/>
  <text x="76" y="250" font-family="system-ui,sans-serif" font-size="12" fill="#3D4F4F">Jon  saved</text>
  <text x="440" y="250" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#15803d"></text>
  <rect x="64" y="272" width="472" height="36" rx="6" fill="#F4F7F7" stroke="#D4E4E4"/>
  <text x="76" y="294" font-family="system-ui,sans-serif" font-size="12" fill="#3D4F4F">Priya  composing</text>
  <circle cx="500" cy="290" r="5" fill="#F0C419"/>
  <!-- Phone -->
  <rect x="620" y="72" width="200" height="340" rx="28" fill="#1A2B2B" stroke="#3D4F4F" stroke-width="2"/>
  <rect x="680" y="88" width="80" height="6" rx="3" fill="#3D4F4F"/>
  <rect x="636" y="108" width="168" height="288" rx="18" fill="#fff"/>
  <text x="652" y="136" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#B01050">GUEST</text>
  <text x="652" y="168" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A2B2B">What stands out</text>
  <text x="652" y="186" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A2B2B">from your pair?</text>
  <rect x="652" y="200" width="136" height="56" rx="6" fill="#F4F7F7" stroke="#D4E4E4" stroke-dasharray="4 3"/>
  <text x="662" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#5A6B6B">Typing&</text>
  <rect x="652" y="272" width="136" height="36" rx="6" fill="#B01050"/>
  <text x="692" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">Save response</text>
  <!-- QR hint -->
  <rect x="64" y="328" width="120" height="28" rx="6" fill="#E6F2F2"/>
  <text x="76" y="346" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0E7C7B">QR / link join</text>
</svg>
